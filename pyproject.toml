[project]
name = "subway-ops"
version = "0.1.0"
description = "Subway franchise operations system: ingestion, marts, dashboard, digest, uOS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "tenacity",
    "pydantic>=2.5",
    "pydantic-settings",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2",
    "pandas>=2.2",
    "pyarrow",
    "python-dateutil",
    "pytz",
    "structlog",
    "bcrypt>=4.0",
    "streamlit>=1.36",
    "streamlit-authenticator>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "responses",
    "ruff",
    "mypy",
    "types-python-dateutil",
    "types-pytz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subway_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Streamlit page files must start with a digit (its nav-order convention),
# which trips ruff's "valid module name" check. The files are scripts, not
# importable modules.
"src/subway_ops/dashboard/pages/*.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/subway_ops"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pyarrow.*",
    "streamlit.*",
    "streamlit_authenticator.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
