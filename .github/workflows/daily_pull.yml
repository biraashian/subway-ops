name: Daily pull

on:
  schedule:
    # 10:00 UTC = 03:00 PT (PST) / 02:00 PT (PDT). The slight wobble is
    # acceptable — every store's business day boundary is 02:00 local so by
    # 03:00 PT yesterday's data is closed and indexed upstream.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run python scripts/migrate.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: prod

      - name: Run daily pull
        run: uv run python scripts/daily_pull.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRESHCONNECT_API_CLIENT: ${{ secrets.FRESHCONNECT_API_CLIENT }}
          FRESHCONNECT_API_KEY: ${{ secrets.FRESHCONNECT_API_KEY }}
          APP_ENV: prod

      - name: Notify on failure
        if: failure()
        run: uv run python scripts/notify_failure.py daily_pull
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
