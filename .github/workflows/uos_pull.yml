name: uOS pull

on:
  schedule:
    # 11:00 UTC daily = 03:00–04:00 PT depending on DST. One hour after
    # daily_pull so any uOS email landing overnight is captured before
    # the dashboard refresh window.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run python scripts/migrate.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: prod

      - name: Run uOS pull
        run: uv run python scripts/uos_pull.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_TOKEN_JSON_B64: ${{ secrets.GMAIL_TOKEN_JSON_B64 }}
          APP_ENV: prod

      - name: Notify on failure
        if: failure()
        run: uv run python scripts/notify_failure.py uos_pull
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
