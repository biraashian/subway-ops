name: Refresh marts

on:
  # Every 4 hours. With the 03:00 PT daily_pull arriving fresh staging,
  # the first refresh of the day picks up overnight data within an hour,
  # and subsequent refreshes catch any late corrections.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh marts
        run: uv run python scripts/refresh_marts.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: prod

      - name: Notify on failure
        if: failure()
        run: uv run python scripts/notify_failure.py refresh_marts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
